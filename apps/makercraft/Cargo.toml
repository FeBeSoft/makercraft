[package]
name = "makercraft"
description = "MakerCraft : application de bureau (ateliers CNC, Laser, PCB, Machines)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["dao", "cao"]
# DAO 2D greffée sur CadCraft (lecture DXF)
dao = ["dep:makercraft-dao"]
# CAO 3D greffée sur SolidCraft (noyau B-rep, STEP)
cao = ["dep:makercraft-cao"]

[dependencies]
makercraft-geom.workspace = true
makercraft-ext-api.workspace = true
makercraft-c2d.workspace = true
makercraft-cam.workspace = true
makercraft-ext-machine.workspace = true
makercraft-dao = { workspace = true, optional = true }
makercraft-cao = { workspace = true, optional = true }
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
