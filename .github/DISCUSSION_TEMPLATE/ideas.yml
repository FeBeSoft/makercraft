labels: ["idée"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you would like to do with MakerCraft, and why.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: With which software, and what bothers you (optional).
