[workspace]
resolver = "3"
members = ["crates/core/*", "crates/ext/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
authors = ["MakerCraft contributors"]

[workspace.dependencies]
# --- noyau MakerCraft ---
makercraft-geom = { path = "crates/core/geom" }
makercraft-ext-api = { path = "crates/core/ext-api" }
# --- extensions ---
makercraft-ext-machine = { path = "crates/ext/machine" }
makercraft-c2d = { path = "crates/ext/c2d" }
makercraft-cam = { path = "crates/ext/cam" }
makercraft-galaad = { path = "crates/ext/galaad" }
makercraft-tooldb = { path = "crates/ext/tooldb" }
makercraft-dao = { path = "crates/ext/dao" }
makercraft-cao = { path = "crates/ext/cao" }
makercraft-mkc = { path = "crates/ext/mkc" }

# --- fondations ---
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
toml = "1"
serialport = "4"
ctrlc = "3"
# icône et version dans les .exe Windows (build.rs des apps)
winresource = "0.1"
# lecture des projets Carbide Create (.c2d = SQLite + JSON compressé zlib)
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
# géométrie 2D pour la FAO : décalages d'outil (buffer) et booléens, Rust pur (MIT/Apache)
geo = "0.33"
# interface graphique (même pile que CadCraft / SolidCraft)
eframe = "0.37"
rfd = "0.17"
# décodage de l'illustration « À propos » (JPEG) de l'application
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- projets amont (MIT/Apache), épinglés sur leur dernière release stable : voir UPSTREAM.md ---
# Seuls des crates SANS interface graphique sont liés : les crates egui de CadCraft et de
# SolidCraft remplacent egui-wgpu et winit par des copies différentes, incompatibles entre elles.
# Ni patch ni modification de leurs sources : ils sont compilés tels quels.
cadcraft-dxf      = { git = "https://github.com/storytold/cadcraft", tag = "v0.20.1" }
cadcraft-doc      = { git = "https://github.com/storytold/cadcraft", tag = "v0.20.1" }
cadcraft-geom     = { git = "https://github.com/storytold/cadcraft", tag = "v0.20.1" }
cadcraft-engine   = { git = "https://github.com/storytold/cadcraft", tag = "v0.20.1" }
cadcraft-io       = { git = "https://github.com/storytold/cadcraft", tag = "v0.20.1" }
cadcraft-render   = { git = "https://github.com/storytold/cadcraft", tag = "v0.20.1" }
solidcraft-kernel = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.41.0" }
solidcore-record  = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.41.0" }
solidcore-tess    = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.41.0" }
solidcraft-io     = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.41.0" }
solidcraft-viewport = { git = "https://github.com/tangency-labs/solidcraft", tag = "v0.41.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

# Aucun [patch] amont nécessaire : les crates liés (cadcraft-dxf, solidcraft-kernel) n'en
# dépendent pas. Si un crate graphique de CadCraft ou de SolidCraft devait être lié un jour,
# ses [patch.crates-io] seraient à recopier ici (un patch ne s'applique qu'au workspace racine).

# Moteur de PDF de craft-pdf (export PDF de cadcraft-io) : mêmes révisions que CadCraft 0.20.1,
# car Cargo ignore les [patch] d'une dépendance. Pas de patch de la famille egui.
[patch.crates-io]
krilla = { version = "=0.8.2", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
