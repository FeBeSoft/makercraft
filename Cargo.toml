[workspace]
resolver = "3"
members = ["crates/core/*", "crates/ext/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
authors = ["MakerCraft contributors"]

[workspace.dependencies]
# --- noyau MakerCraft ---
makercraft-geom = { path = "crates/core/geom" }
makercraft-ext-api = { path = "crates/core/ext-api" }
# --- extensions ---
makercraft-ext-machine = { path = "crates/ext/machine" }
makercraft-c2d = { path = "crates/ext/c2d" }
makercraft-cam = { path = "crates/ext/cam" }
makercraft-galaad = { path = "crates/ext/galaad" }
makercraft-tooldb = { path = "crates/ext/tooldb" }

# --- fondations ---
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serialport = "4"
ctrlc = "3"
# icÃ´ne et version dans les .exe Windows (build.rs des apps)
winresource = "0.1"
# lecture des projets Carbide Create (.c2d = SQLite + JSON compressÃ© zlib)
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
# gÃ©omÃ©trie 2D pour la FAO : dÃ©calages d'outil (buffer) et boolÃ©ens, Rust pur (MIT/Apache)
geo = "0.33"
# interface graphique (mÃªme pile que CadCraft / SolidCraft)
eframe = "0.37"
rfd = "0.17"

# --- projets amont (MIT/Apache), Ã©pinglÃ©s : voir UPSTREAM.md ---
# DÃ©commentÃ©s au branchement des extensions dao (CadCraft) et cao (SolidCraft).
# cadcraft-engine   = { git = "https://github.com/storytold/cadcraft", tag = "v0.8.0" }
# cadcraft-io       = { git = "https://github.com/storytold/cadcraft", tag = "v0.8.0" }
# solidcraft-kernel = { git = "https://github.com/bherbruck/solidcraft", tag = "v0.15.0" }
# solidcraft-engine = { git = "https://github.com/bherbruck/solidcraft", tag = "v0.15.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

