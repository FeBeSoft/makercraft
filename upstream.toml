# Projets amont suivis par MakerCraft. Lu par `cargo xtask upstream`.
# Les clones vivent hors du dépôt, en lecture seule : ne jamais les modifier.
#
# kind = "dependency" : crates Rust utilisées telles quelles (git + tag épinglé dans Cargo.toml).
# kind = "port"       : code GPL traduit en Rust ; on suit les fichiers listés dans [[port]].

[[repo]]
name = "cadcraft"
url = "https://github.com/storytold/cadcraft"
path = "../upstream/cadcraft"
pinned = "v0.8.0"
kind = "dependency"
license = "MIT OR Apache-2.0"

[[repo]]
name = "solidcraft"
url = "https://github.com/bherbruck/solidcraft"
path = "../upstream/solidcraft"
pinned = "v0.15.0"
kind = "dependency"
license = "MIT OR Apache-2.0"

[[repo]]
name = "LaserGRBL"
url = "https://github.com/arkypita/LaserGRBL"
path = "../upstream/LaserGRBL"
pinned = "v7.14.1"
kind = "port"
license = "GPL-3.0"

[[repo]]
name = "Candle"
url = "https://github.com/Denvi/Candle"
path = "../upstream/Candle"
pinned = "c04e6f2"
kind = "port"
license = "GPL-3.0"

[[repo]]
name = "UGS"
url = "https://github.com/winder/Universal-G-Code-Sender"
path = "../upstream/Universal-G-Code-Sender"
pinned = "v2.1.27"
kind = "port"
license = "GPL-3.0"

# kind = "reference" : projets consultés pour les idées et l'ergonomie, rien n'est porté pour l'instant.

[[repo]]
name = "bCNC"
url = "https://github.com/vlachoudis/bCNC"
path = "../upstream/bCNC"
pinned = "1.0.0"
kind = "reference"
license = "GPL-2.0"

[[repo]]
name = "OpenBuilds-CONTROL"
url = "https://github.com/OpenBuilds/OpenBuilds-CONTROL"
path = "../upstream/OpenBuilds-CONTROL"
pinned = "v1.0.390"
kind = "reference"
license = "GPL-3.0"

[[repo]]
name = "COPO"
url = "https://github.com/gbulleryahen-hash/copo"
path = "../upstream/copo"
pinned = "9219817"   # version 1.322 (pas de tags dans ce dépôt)
kind = "reference"
license = "GPL-3.0"

[[repo]]
name = "craft-launcher"
url = "https://github.com/storytold/craft-launcher"
path = "../upstream/craft-launcher"
pinned = "v0.11.1"   # ArtCraft Launcher
kind = "reference"
license = "MIT OR Apache-2.0"

[[repo]]
name = "cavalier_contours"
url = "https://github.com/jbuckmccready/cavalier_contours"
path = "../upstream/cavalier_contours"
pinned = "0.9.0"   # offsets et booléens de polylignes avec arcs (candidat dépendance pour makercraft-cam)
kind = "reference"
license = "MIT OR Apache-2.0"

[[repo]]
name = "grblHAL"
url = "https://github.com/grblHAL/core"
path = "../upstream/grblHAL-core"
pinned = "ffbb587"   # pas de tag de version récent ; source officielle du protocole grblHAL
kind = "reference"
license = "GPL-3.0"

[[repo]]
name = "gSender"
url = "https://github.com/Sienci-Labs/gsender"
path = "../upstream/gsender"
pinned = "v1.6.4"
kind = "reference"
license = "GPL-3.0"

[[repo]]
name = "svg2gcode"
url = "https://github.com/sameer/svg2gcode"
path = "../upstream/svg2gcode"
pinned = "cli-v0.0.19"
kind = "reference"
license = "MIT"

# --- Fichiers portés (ou à porter) : notre fichier ← fichier source ---
# status = "prévu" | "porté" ; `cargo xtask upstream` signale tout changement de la source
# entre `pinned` et la dernière version amont.

# Transport
[[port]]
ours = "crates/ext/machine/src/transport/mod.rs (trait Transport)"
repo = "LaserGRBL"
source = "LaserGRBL/ComWrapper/IComWrapper.cs"
status = "porté"

[[port]]
ours = "crates/ext/machine/src/transport/mod.rs (trait Transport)"
repo = "Candle"
source = "src/candle/connections/connection.h"
status = "porté"

[[port]]
ours = "crates/ext/machine/src/transport/tcp.rs"
repo = "LaserGRBL"
source = "LaserGRBL/ComWrapper/Telnet.cs"
status = "porté"

[[port]]
ours = "crates/ext/machine/src/transport/emulator.rs"
repo = "LaserGRBL"
source = "LaserGRBL/GrblEmulator/Grblv11Emulator.cs"
status = "porté"

# Protocole et contrôleur
[[port]]
ours = "crates/ext/machine/src/protocol.rs + controller/ (mod.rs, stream.rs)"
repo = "LaserGRBL"
source = "LaserGRBL/Core/GrblCore.cs"
status = "porté"

[[port]]
ours = "crates/ext/machine/src/protocol.rs (prepare_line)"
repo = "LaserGRBL"
source = "LaserGRBL/GrblCommand.cs"
status = "porté"

[[port]]
ours = "crates/ext/machine/src/controller/mod.rs (Controller)"
repo = "UGS"
source = "ugs-core/src/com/willwinder/universalgcodesender/IController.java"
status = "porté"

[[port]]
ours = "crates/ext/machine/src/controller/stream.rs"
repo = "UGS"
source = "ugs-core/src/com/willwinder/universalgcodesender/communicator/ICommunicator.java"
status = "porté"

[[port]]
ours = "crates/ext/machine/src/protocol.rs (MachineState)"
repo = "UGS"
source = "ugs-core/src/com/willwinder/universalgcodesender/listeners/ControllerState.java"
status = "porté"

# Données
[[port]]
ours = "crates/ext/machine/data/ (error, alarm, setting_codes.v1.1)"
repo = "LaserGRBL"
source = "LaserGRBL/CSV"
status = "porté"

# À venir : G-code (aperçu, estimation de durée)
[[port]]
ours = "crates/ext/machine/src/gcode/"
repo = "Candle"
source = "src/candle/parser/gcodeparser.cpp"
status = "prévu"

[[port]]
ours = "crates/ext/machine/src/gcode/arcs.rs"
repo = "Candle"
source = "src/candle/parser/gcodepreprocessorutils.cpp"
status = "prévu"
