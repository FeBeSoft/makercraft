# Projets amont suivis par MakerCraft. Lu par `cargo xtask upstream`.
# Les clones vivent hors du dépôt, en lecture seule : ne jamais les modifier.
#
# kind = "dependency" : crates Rust utilisées telles quelles (git + tag épinglé dans Cargo.toml).
# kind = "port"       : code GPL traduit en Rust ; on suit les fichiers listés dans [[port]].

[[repo]]
name = "cadcraft"
url = "https://github.com/storytold/cadcraft"
path = "../upstream/cadcraft"
pinned = "v0.8.0"
kind = "dependency"
license = "MIT OR Apache-2.0"

[[repo]]
name = "solidcraft"
url = "https://github.com/bherbruck/solidcraft"
path = "../upstream/solidcraft"
pinned = "v0.15.0"
kind = "dependency"
license = "MIT OR Apache-2.0"

[[repo]]
name = "LaserGRBL"
url = "https://github.com/arkypita/LaserGRBL"
path = "../upstream/LaserGRBL"
pinned = "v7.14.1"
kind = "port"
license = "GPL-3.0"

[[repo]]
name = "Candle"
url = "https://github.com/Denvi/Candle"
