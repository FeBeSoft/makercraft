[package]
name = "makercraft-ext-machine"
description = "MakerCraft : pilotage de machines Grbl/grblHAL (laser, fraiseuse) — portage LaserGRBL/Candle/UGS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["serial"]
# Port série USB (natif uniquement ; à couper pour une version web).
serial = ["dep:serialport"]

[dependencies]
makercraft-ext-api.workspace = true
makercraft-geom.workspace = true
thiserror.workspace = true
serialport = { workspace = true, optional = true }

[lints]
workspace = true
